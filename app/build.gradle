plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.hivisionvr'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.hivisionvr"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }

    // O arquivo .tflite NAO pode ser compactado pelo AAPT, ou o TensorFlow Lite
    // nao consegue fazer mmap() nele em runtime.
    androidResources {
        noCompress += "tflite"
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // CameraX - fornece captura de camera moderna, eficiente e com ciclo de vida gerenciado
    def camerax_version = "1.3.4"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"

    // TensorFlow Lite Task Library (Vision) - API de alto nivel para detecção de objetos,
    // ja cuida de pre/pos-processamento e le rotulos/metadados embutidos no modelo.
    implementation 'org.tensorflow:tensorflow-lite-task-vision:0.4.4'

    // MediaPipe Tasks Vision - usado aqui só para o Gesture Recognizer (detecção de "joinha").
    implementation 'com.google.mediapipe:tasks-vision:0.10.14'
}
